<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veta Kronometre Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&family=Press+Start+2P&family=Rajdhani:wght@500;700&family=Caveat:wght@600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Dopamin Efekti İçin Confetti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #0d0d12;
            --surface-color: #1a1a24;
            --text-color: #ffffff;
            --text-muted: #888899;
            --primary-color: #00e5ff;
            --ring-bg: #2a2a35;
            --font-family: 'Share Tech Mono', monospace;
            --glow-spread: 15px;
        }

        body.light-mode {
            --bg-color: #f0f2f5;
            --surface-color: #ffffff;
            --text-color: #1a1a1a;
            --text-muted: #666666;
            --ring-bg: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* RPG XP Bar Sistemi */
        .user-profile {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            margin-top: 10px;
            gap: 15px;
            animation: slideDown 0.5s ease;
        }

        .level-badge {
            background: var(--surface-color);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.2), inset 0 0 5px var(--primary-color);
            text-shadow: 0 0 5px var(--primary-color);
        }

        .xp-container {
            flex: 1;
            max-width: 200px;
        }

        .xp-text {
            display: flex;
            justify-content: space-between;
            font-family: 'Roboto', sans-serif;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .xp-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--ring-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .xp-bar-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--primary-color);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Üst Menü */
        .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; z-index: 10; }
        .settings-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; transition: color 0.3s, transform 0.3s; }
        .settings-btn:active { transform: rotate(45deg); }
        .settings-btn svg { width: 28px; height: 28px; fill: currentColor; }
        .mode-selector { display: flex; gap: 10px; }
        .mode-btn { background: transparent; border: 2px solid transparent; color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-size: 14px; font-family: 'Roboto', sans-serif; font-weight: 500; cursor: pointer; transition: all 0.3s ease; }
        .mode-btn.active { background: var(--surface-color); color: var(--primary-color); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        .spacer { width: 38px; }

        /* Ana Gösterge Alanı & Kristal */
        .display-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-height: 350px; }
        
        .timer-circle {
            position: relative; width: 290px; height: 290px; display: flex; align-items: center; justify-content: center;
        }

        /* Sis ve Işık Efekti (Fog Engine) */
        .glow-effect {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle, var(--primary-color) 0%, transparent 70%);
            opacity: 0.15; filter: blur(var(--glow-spread));
            transition: all 0.5s ease;
            z-index: 0;
            animation: breathe 4s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { transform: scale(0.95); opacity: 0.1; }
            100% { transform: scale(1.1); opacity: 0.25; }
        }

        .timer-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); z-index: 1; filter: drop-shadow(0 0 10px var(--primary-color)); }
        .timer-bg { fill: none; stroke: var(--ring-bg); stroke-width: 6; transition: stroke 0.4s ease; }
        .timer-progress { fill: none; stroke: var(--primary-color); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 816; stroke-dashoffset: 816; transition: stroke 0.4s ease; }

        /* Odak Kristali (İleride evrimleşecek objenin temeli) */
        .focus-crystal {
            position: absolute; top: -20px;
            width: 30px; height: 30px;
            background: var(--primary-color);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 0 20px var(--primary-color);
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 5;
            animation: floatCrystal 3s infinite ease-in-out;
        }
        
        body.mode-pomodoro .focus-crystal { opacity: 0.8; }

        @keyframes floatCrystal {
            0%, 100% { transform: translateY(0) scale(1); filter: brightness(1); }
            50% { transform: translateY(-10px) scale(1.1); filter: brightness(1.3); }
        }

        .time-display { font-size: 4rem; font-weight: normal; letter-spacing: 2px; z-index: 10; text-shadow: 0 0 20px rgba(0,0,0,0.3); transition: all 0.4s ease; }
        
        /* Görünümler */
        body.layout-minimal .timer-bg, body.layout-minimal .timer-progress, body.layout-minimal .glow-effect { display: none; }
        body.layout-dashboard .timer-circle { width: 320px; height: 150px; }
        body.layout-dashboard .timer-bg, body.layout-dashboard .timer-progress, body.layout-dashboard .glow-effect { display: none; }
        body.layout-dashboard .time-display { font-size: 3.5rem; background: var(--surface-color); padding: 20px 40px; border-radius: 15px; border-left: 5px solid var(--primary-color); }

        /* Kontroller */
        .controls { display: flex; justify-content: center; gap: 20px; padding: 10px 30px 20px 30px; z-index: 10;}
        .ctrl-btn { width: 75px; height: 75px; border-radius: 50%; border: none; font-size: 16px; font-weight: bold; font-family: 'Roboto', sans-serif; color: #fff; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.3); transition: transform 0.1s, filter 0.3s; }
        .ctrl-btn:active { transform: scale(0.90); }
        .btn-start { background: linear-gradient(135deg, #2ed573, #26ae60); }
        .btn-stop { background: linear-gradient(135deg, #ff4757, #c0392b); }
        .btn-lap { background: linear-gradient(135deg, #747d8c, #57606f); }
        .btn-reset { background: linear-gradient(135deg, #ffa502, #e67e22); }

        /* Turlar */
        .laps-container { flex: 1; overflow-y: auto; padding: 0 30px 30px 30px; max-height: 25vh; }
        .laps-container::-webkit-scrollbar { display: none; }
        .lap-list { list-style: none; }
        .lap-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--ring-bg); font-family: var(--font-family); font-size: 1.1rem; animation: fadeIn 0.3s ease; }
        .lap-best { color: #2ed573; font-weight: bold; }
        .lap-worst { color: #ff4757; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Ayarlar Modalı */
        .settings-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .settings-overlay.active { opacity: 1; pointer-events: auto; }
        .settings-panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 85vh; background: var(--surface-color); border-top-left-radius: 35px; border-top-right-radius: 35px; padding: 25px 25px 50px 25px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
        .settings-overlay.active .settings-panel { transform: translateY(0); }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--ring-bg); }
        .settings-header h2 { font-family: 'Roboto', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text-color); }
        .close-btn { background: var(--ring-bg); border: none; color: var(--text-color); width: 35px; height: 35px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .settings-content { overflow-y: auto; flex: 1; padding-right: 5px; }
        .settings-content::-webkit-scrollbar { display: none; }
        .setting-group { margin-bottom: 25px; }
        .setting-title { font-family: 'Roboto', sans-serif; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;}
        
        .options-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
        .options-row::-webkit-scrollbar { display: none; }
        
        .opt-btn { background: var(--bg-color); border: 2px solid transparent; color: var(--text-color); padding: 10px 18px; border-radius: 12px; white-space: nowrap; font-family: 'Roboto', sans-serif; font-weight: 500; transition: all 0.2s; }
        .opt-btn.active { border-color: var(--primary-color); color: var(--primary-color); background: rgba(0,0,0,0.2); box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* Gelişmiş Renk Seçici */
        .color-picker-wrapper { display: flex; align-items: center; gap: 15px; }
        .custom-color-input { -webkit-appearance: none; width: 40px; height: 40px; border: none; border-radius: 50%; cursor: pointer; overflow: hidden; }
        .custom-color-input::-webkit-color-swatch-wrapper { padding: 0; }
        .custom-color-input::-webkit-color-swatch { border: 2px solid var(--text-color); border-radius: 50%; }
        
        .color-circle { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; transition: transform 0.2s, box-shadow 0.2s; }
        .color-circle.active { border-color: var(--text-color); transform: scale(1.2); box-shadow: 0 0 15px currentColor; }

        /* Animasyon Seçenekleri */
        body.anim-smooth .timer-progress { transition: stroke-dashoffset 0.1s linear; }
        body.anim-tick .timer-progress { transition: stroke-dashoffset 0.2s steps(1); }
        body.anim-pulse .timer-circle { animation: pulse 1s infinite ease-in-out; }
        body.anim-none .timer-progress, body.anim-none .glow-effect { transition: none; animation: none; opacity: 0; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

    </style>
</head>
<body class="anim-smooth layout-classic mode-stopwatch">

    <!-- RPG XP Bar ve Seviye Sistemi -->
    <div class="user-profile">
        <div class="level-badge" id="levelBadge">1</div>
        <div class="xp-container">
            <div class="xp-text">
                <span id="rankTitle">Çaylak Odaklanıcı</span>
                <span id="xpText">0 / 100 XP</span>
            </div>
            <div class="xp-bar-bg">
                <div class="xp-bar-fill" id="xpBarFill"></div>
            </div>
        </div>
    </div>

    <!-- Üst Menü -->
    <div class="top-bar">
        <button class="settings-btn" onclick="toggleSettings()">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        </button>
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('stopwatch')">Kronometre</button>
            <button class="mode-btn" onclick="setMode('pomodoro')">Pomodoro</button>
        </div>
        <div class="spacer"></div>
    </div>

    <!-- Ana Gösterge -->
    <div class="display-container">
        <div class="timer-circle" id="timerCircle">
            <div class="glow-effect"></div>
            <div class="focus-crystal"></div>
            <svg class="timer-svg" viewBox="0 0 280 280">
                <circle class="timer-bg" cx="140" cy="140" r="130"></circle>
                <circle class="timer-progress" id="progressRing" cx="140" cy="140" r="130"></circle>
            </svg>
            <div class="time-display" id="timeDisplay" style="font-size: 3.5rem;">00:00.00</div>
        </div>
    </div>

    <!-- Kontroller -->
    <div class="controls">
        <button class="ctrl-btn btn-reset" onclick="resetTimer()">Sıfırla</button>
        <button class="ctrl-btn btn-start" id="startBtn" onclick="toggleTimer()">Başla</button>
        <button class="ctrl-btn btn-lap" id="lapBtn" onclick="recordLap()">Tur</button>
    </div>

    <!-- Turlar Listesi -->
    <div class="laps-container" id="lapsContainer">
        <ul class="lap-list" id="lapList"></ul>
    </div>

    <!-- Ayarlar Modalı -->
    <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings(event)">
        <div class="settings-panel" onclick="event.stopPropagation()">
            <div class="settings-header">
                <h2>Özelleştirme (Premium)</h2>
                <button class="close-btn" onclick="toggleSettings()">✕</button>
            </div>
            
            <div class="settings-content">
                
                <!-- Renk Paleti (Neonlar + Özel Renk) -->
                <div class="setting-group">
                    <div class="setting-title">Aura Rengi (Neon & Özel)</div>
                    <div class="color-picker-wrapper">
                        <!-- Özel Renk Seçici -->
                        <input type="color" class="custom-color-input" id="customColorPicker" value="#00e5ff" onchange="applyCustomColor(this.value)" title="Özel Renk Seç">
                        <div class="options-row" style="padding-bottom: 0;">
                            <div class="color-circle active" style="background-color: #00e5ff; color: #00e5ff;" onclick="applyColor(this, '#00e5ff')"></div>
                            <div class="color-circle" style="background-color: #39ff14; color: #39ff14;" onclick="applyColor(this, '#39ff14')"></div> <!-- Neon Yeşil -->
                            <div class="color-circle" style="background-color: #ff00ff; color: #ff00ff;" onclick="applyColor(this, '#ff00ff')"></div> <!-- Neon Pembe -->
                            <div class="color-circle" style="background-color: #ff3300; color: #ff3300;" onclick="applyColor(this, '#ff3300')"></div> <!-- Neon Turuncu -->
                            <div class="color-circle" style="background-color: #bf00ff; color: #bf00ff;" onclick="applyColor(this, '#bf00ff')"></div> <!-- Neon Mor -->
                            <div class="color-circle" style="background-color: #ffe600; color: #ffe600;" onclick="applyColor(this, '#ffe600')"></div> <!-- Neon Sarı -->
                        </div>
                    </div>
                </div>

                <!-- Font Seçimi (Devasa Kütüphane) -->
                <div class="setting-group">
                    <div class="setting-title">Yazı Tipi Ailesi</div>
                    <div class="options-row">
                        <button class="opt-btn font-opt active" onclick="applyFont(this, 'Share Tech Mono')">Dijital 1</button>
                        <button class="opt-btn font-opt" onclick="applyFont(this, 'Orbitron')">Cyberpunk</button>
                        <button class="opt-btn font-opt" onclick="applyFont(this, 'Press Start 2P')">Retro 8-Bit</button>
                        <button class="opt-btn font-opt" onclick="applyFont(this, 'Rajdhani')">Modern Teknoloji</button>
                        <button class="opt-btn font-opt" onclick="applyFont(this, 'Caveat')">El Yazısı</button>
                        <button class="opt-btn font-opt" onclick="applyFont(this, 'Roboto')">Klasik Minimal</button>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="setting-title">Animasyon & Sis Efekti</div>
                    <div class="options-row">
                        <button class="opt-btn anim-opt active" onclick="applyAnim(this, 'anim-smooth')">Akıcı (60 FPS)</button>
                        <button class="opt-btn anim-opt" onclick="applyAnim(this, 'anim-pulse')">Nabız (Odak)</button>
                        <button class="opt-btn anim-opt" onclick="applyAnim(this, 'anim-tick')">Mekanik Tik-Tak</button>
                        <button class="opt-btn anim-opt" onclick="applyAnim(this, 'anim-none')">Sisi & Hareketi Kapat</button>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="setting-title">Sayaç Düzeni</div>
                    <div class="options-row">
                        <button class="opt-btn layout-opt active" onclick="applyLayout(this, 'layout-classic')">Halka & Kristal</button>
                        <button class="opt-btn layout-opt" onclick="applyLayout(this, 'layout-minimal')">Sadece Yazı</button>
                        <button class="opt-btn layout-opt" onclick="applyLayout(this, 'layout-dashboard')">Panel Modu</button>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="setting-title">Arka Plan Tema</div>
                    <div class="options-row">
                        <button class="opt-btn bg-opt active" onclick="applyTheme(this, 'dark')">AMOLED Siyahı</button>
                        <button class="opt-btn bg-opt" onclick="applyTheme(this, 'light')">Buz Beyazı</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- GAMIFICATION & XP SYSTEM --- */
        let userLevel = parseInt(localStorage.getItem('veta_level')) || 1;
        let userXP = parseInt(localStorage.getItem('veta_xp')) || 0;
        
        const Ranks = ["Çaylak Odaklanıcı", "Zaman Bükücü", "Odak Şövalyesi", "Üstat", "Efsanevi", "Kahraman (Heroic)"];
        
        function getXPForNextLevel(level) {
            return level * 100; // Her seviye 100 xp artar (100, 200, 300...)
        }

        function updateXPUI() {
            const nextLevelXP = getXPForNextLevel(userLevel);
            document.getElementById('levelBadge').textContent = userLevel;
            document.getElementById('xpText').textContent = `${userXP} / ${nextLevelXP} XP`;
            
            const progressPct = (userXP / nextLevelXP) * 100;
            document.getElementById('xpBarFill').style.width = `${progressPct}%`;
            
            let rankIndex = Math.floor((userLevel - 1) / 5);
            if(rankIndex > Ranks.length - 1) rankIndex = Ranks.length - 1;
            document.getElementById('rankTitle').textContent = Ranks[rankIndex];
            
            localStorage.setItem('veta_level', userLevel);
            localStorage.setItem('veta_xp', userXP);
        }

        function addXP(amount) {
            userXP += amount;
            let nextLevelXP = getXPForNextLevel(userLevel);
            let leveledUp = false;

            while (userXP >= nextLevelXP) {
                userXP -= nextLevelXP;
                userLevel++;
                nextLevelXP = getXPForNextLevel(userLevel);
                leveledUp = true;
            }

            updateXPUI();
            
            if (leveledUp) {
                setTimeout(() => {
                    alert(`Tebrikler! Seviye ${userLevel} oldunuz! Yeni unvan: ${document.getElementById('rankTitle').textContent}`);
                    fireConfetti(true); // Seviye atlayınca özel altın konfeti
                }, 500);
            }
        }

        updateXPUI(); // İlk yüklemede çalıştır

        /* --- VETA ENGINE v4.0 - Core Logic --- */
        let mode = 'stopwatch';
        let isRunning = false;
        let startTime = 0;
        let elapsedTime = 0;
        let animationFrameId;
        let lapArray = [];
        
        const POMODORO_WORK_TIME = 25 * 60 * 1000;
        let pomodoroTimeLeft = POMODORO_WORK_TIME;

        const timeDisplay = document.getElementById('timeDisplay');
        const progressRing = document.getElementById('progressRing');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const lapList = document.getElementById('lapList');
        const settingsOverlay = document.getElementById('settingsOverlay');
        
        const radius = progressRing.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = circumference;

        function updateEngine(timestamp) {
            if (!isRunning) return;

            let displayTime = 0;
            let progress = 0;

            if (mode === 'stopwatch') {
                elapsedTime = performance.now() - startTime;
                displayTime = elapsedTime;
                progress = (displayTime % 60000) / 60000; 
            } else {
                const passedTime = performance.now() - startTime;
                let currentLeft = pomodoroTimeLeft - passedTime;
                
                // Odak kristalinin parlaklığını kalan süreye göre artır
                const crystal = document.querySelector('.focus-crystal');
                if(crystal) {
                    let intensity = 0.8 + ((POMODORO_WORK_TIME - currentLeft) / POMODORO_WORK_TIME) * 1.5;
                    crystal.style.transform = `scale(${intensity})`;
                }

                if (currentLeft <= 0) {
                    currentLeft = 0;
                    toggleTimer();
                    pomodoroCompleted(); // Ödül ve XP tetikle
                }
                displayTime = currentLeft;
                progress = 1 - (displayTime / POMODORO_WORK_TIME);
            }

            renderTime(displayTime);
            progressRing.style.strokeDashoffset = circumference - (progress * circumference);
            animationFrameId = requestAnimationFrame(updateEngine);
        }

        function renderTime(timeInMs) {
            const date = new Date(timeInMs);
            const minutes = String(date.getUTCMinutes()).padStart(2, '0');
            const seconds = String(date.getUTCSeconds()).padStart(2, '0');
            const milliseconds = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
            
            if (mode === 'pomodoro') {
                timeDisplay.textContent = `${minutes}:${seconds}`;
            } else {
                timeDisplay.textContent = `${minutes}:${seconds}.${milliseconds}`;
            }
        }

        // Haptic Feedback (Titreşim) Yardımcısı
        function triggerVibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function toggleTimer() {
            triggerVibrate(30);
            if (isRunning) {
                isRunning = false;
                cancelAnimationFrame(animationFrameId);
                if (mode !== 'stopwatch') {
                    pomodoroTimeLeft = pomodoroTimeLeft - (performance.now() - startTime);
                }
                startBtn.textContent = 'Başla';
                startBtn.style.background = 'linear-gradient(135deg, #2ed573, #26ae60)';
            } else {
                isRunning = true;
                startTime = performance.now();
                if (mode === 'stopwatch') {
                    startTime -= elapsedTime;
                }
                startBtn.textContent = 'Durdur';
                startBtn.style.background = 'linear-gradient(135deg, #ff4757, #c0392b)';
                animationFrameId = requestAnimationFrame(updateEngine);
            }
        }

        function resetTimer() {
            triggerVibrate(50);
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            startBtn.textContent = 'Başla';
            startBtn.style.background = 'linear-gradient(135deg, #2ed573, #26ae60)';
            
            if (mode === 'stopwatch') {
                elapsedTime = 0;
                renderTime(0);
            } else {
                pomodoroTimeLeft = POMODORO_WORK_TIME;
                renderTime(pomodoroTimeLeft);
                document.querySelector('.focus-crystal').style.transform = 'scale(0.8)';
            }
            progressRing.style.strokeDashoffset = circumference;
            lapList.innerHTML = '';
            lapArray = [];
        }

        /* Akıllı Tur İstatistik Sistemi (En Hızlı / En Yavaş) */
        function recordLap() {
            if (mode !== 'stopwatch') return;
            if (!isRunning && elapsedTime === 0) return;
            triggerVibrate([20, 30, 20]); // Özel titreşim paterni

            let currentLapTime = elapsedTime;
            let previousLapsTotal = lapArray.reduce((a, b) => a + b, 0);
            let lapDuration = currentLapTime - previousLapsTotal;
            
            lapArray.push(lapDuration);
            renderLaps();
        }

        function renderLaps() {
            lapList.innerHTML = '';
            
            let minLap = Math.min(...lapArray);
            let maxLap = Math.max(...lapArray);

            for(let i = lapArray.length - 1; i >= 0; i--) {
                const li = document.createElement('li');
                li.className = 'lap-item';
                
                let isBest = (lapArray[i] === minLap && lapArray.length > 1);
                let isWorst = (lapArray[i] === maxLap && lapArray.length > 1);

                const lapTitle = document.createElement('span');
                lapTitle.textContent = `Tur ${i + 1}`;
                lapTitle.style.color = "var(--text-muted)";
                
                const lapTimeSpan = document.createElement('span');
                const date = new Date(lapArray[i]);
                lapTimeSpan.textContent = `${String(date.getUTCMinutes()).padStart(2, '0')}:${String(date.getUTCSeconds()).padStart(2, '0')}.${String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0')}`;
                
                if (isBest) {
                    lapTimeSpan.classList.add('lap-best');
                    lapTitle.textContent += " (En Hızlı)";
                } else if (isWorst) {
                    lapTimeSpan.classList.add('lap-worst');
                    lapTitle.textContent += " (En Yavaş)";
                } else {
                    lapTimeSpan.style.color = "var(--text-color)";
                }

                li.appendChild(lapTitle);
                li.appendChild(lapTimeSpan);
                lapList.appendChild(li);
            }
        }

        function setMode(newMode) {
            if(isRunning) toggleTimer();
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Mode CSS Update
            document.body.classList.remove('mode-stopwatch', 'mode-pomodoro');
            document.body.classList.add(`mode-${mode}`);

            if (mode === 'stopwatch') {
                lapBtn.style.display = 'block';
                document.getElementById('lapsContainer').style.display = 'block';
            } else {
                lapBtn.style.display = 'none';
                document.getElementById('lapsContainer').style.display = 'none';
            }
            resetTimer();
        }

        /* --- Dopamin / Ödül Efektleri --- */
        function pomodoroCompleted() {
            triggerVibrate([100, 50, 100, 50, 100]); // Uzun titreşim
            fireConfetti(false);
            addXP(50); // 25 dakika için 50 XP
        }

        function fireConfetti(isLevelUp) {
            var duration = isLevelUp ? 5000 : 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: isLevelUp ? ['#ffd700', '#ffaa00'] : [getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim(), '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: isLevelUp ? ['#ffd700', '#ffaa00'] : [getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim(), '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        /* --- Ayarlar Modalı İşlemleri --- */
        function toggleSettings() { settingsOverlay.classList.toggle('active'); triggerVibrate(15); }
        function closeSettings(e) { if(e.target === settingsOverlay) { settingsOverlay.classList.remove('active'); } }

        function applyColor(element, colorHex) {
            document.querySelectorAll('.color-circle').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
            document.documentElement.style.setProperty('--primary-color', colorHex);
            document.getElementById('customColorPicker').value = colorHex;
        }

        function applyCustomColor(colorHex) {
            document.querySelectorAll('.color-circle').forEach(el => el.classList.remove('active'));
            document.documentElement.style.setProperty('--primary-color', colorHex);
        }

        function applyTheme(element, theme) {
            document.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            if(theme === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
        }

        function applyFont(element, fontName) {
            document.querySelectorAll('.font-opt').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            if(fontName === 'Press Start 2P') timeDisplay.style.fontSize = '2.2rem';
            else timeDisplay.style.fontSize = '3.5rem';
            
            document.documentElement.style.setProperty('--font-family', `'${fontName}', sans-serif`);
        }

        function applyLayout(element, layoutClass) {
            document.querySelectorAll('.layout-opt').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.body.classList.remove('layout-classic', 'layout-minimal', 'layout-dashboard');
            document.body.classList.add(layoutClass);
        }

        function applyAnim(element, animClass) {
            document.querySelectorAll('.anim-opt').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.body.classList.remove('anim-smooth', 'anim-tick', 'anim-pulse', 'anim-none');
            document.body.classList.add(animClass);
        }

        renderTime(0);
    </script>
</body>
</html>
