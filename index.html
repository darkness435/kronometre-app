<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Veta Focus Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    
    <!-- Ultra-Premium Font Kütüphanesi -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@500;700&family=Space+Grotesk:wght@500;700&family=Rajdhani:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* --- VETA ENGINE v5.1 - CORE VARIABLES --- */
        :root {
            --bg-color: #050505;
            --surface-color: rgba(25, 25, 30, 0.6);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8e8e9f;
            --primary: #00e5ff;
            --primary-glow: rgba(0, 229, 255, 0.4);
            --ring-bg: rgba(255, 255, 255, 0.05);
            --timer-font: 'Space Grotesk', sans-serif;
            --ui-font: 'Inter', sans-serif;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        body.light-theme {
            --bg-color: #f2f2f7;
            --surface-color: rgba(255, 255, 255, 0.8);
            --surface-border: rgba(0, 0, 0, 0.05);
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --ring-bg: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--ui-font);
            height: 100vh;
            width: 100vw;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Genel ekranın sağa sola/yukarı aşağı kaymasını engeller */
            transition: background-color 0.5s ease;
            position: fixed; /* Mobil tarayıcılarda ekran sekmelerini kilitler */
        }

        /* --- APP ARCHITECTURE (PAGES) --- */
        .app-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            padding-bottom: calc(80px + var(--safe-area-bottom));
            overflow-x: hidden; /* Sayfanın sağa kaymasını tamamen kilitler */
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        /* --- HEADER --- */
        .header {
            padding: 30px 25px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--text-main), var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- TIMER DISPLAY (ULTIMATE RING) --- */
        .timer-showcase {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .timer-circle {
            position: relative;
            width: 300px; height: 300px;
            display: flex; align-items: center; justify-content: center;
        }

        .timer-svg {
            position: absolute; width: 100%; height: 100%; transform: rotate(-90deg);
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }
        
        .timer-bg { fill: none; stroke: var(--ring-bg); stroke-width: 4; }
        .timer-progress {
            fill: none; stroke: var(--primary); stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 879; /* 2 * PI * 140 */
            stroke-dashoffset: 879;
        }

        .time-text {
            font-family: var(--timer-font);
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            z-index: 10;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .ms-text { font-size: 1.5rem; color: var(--text-muted); position: absolute; bottom: 60px; }

        /* Odak Çekirdeği */
        .focus-core {
            position: absolute;
            width: 220px; height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), var(--primary) 60%, transparent 80%);
            opacity: 0;
            filter: blur(10px);
            z-index: 0;
            transition: opacity 1s ease;
            animation: corePulse 4s infinite alternate ease-in-out;
        }

        @keyframes corePulse {
            0% { transform: scale(0.85); filter: blur(15px); opacity: 0.1; }
            100% { transform: scale(1.05); filter: blur(25px); opacity: 0.3; }
        }

        /* --- CONTROLS --- */
        .controls-wrapper {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        .btn-glass {
            width: 75px; height: 75px;
            border-radius: 50%;
            border: 1px solid var(--surface-border);
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text-main);
            font-family: var(--ui-font);
            font-weight: 600;
            font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .btn-glass:active { transform: scale(0.9); }
        .btn-start { background: var(--primary); color: #000; border: none; box-shadow: 0 0 20px var(--primary-glow); }
        .btn-stop { background: #ff3b30; color: #fff; border: none; box-shadow: 0 0 20px rgba(255, 59, 48, 0.4); }

        /* --- LAPS & LISTS --- */
        .list-container {
            flex: 1; 
            overflow-y: auto; 
            overflow-x: hidden; /* Yatay kaymayı engeller */
            padding: 0 25px;
            -webkit-overflow-scrolling: touch;
        }
        .list-container::-webkit-scrollbar { display: none; }
        
        .lap-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px;
            margin-bottom: 10px;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-family: var(--timer-font);
            font-size: 1.1rem;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        
        .lap-title { color: var(--text-muted); font-family: var(--ui-font); font-size: 0.9rem; font-weight: 500; }
        .lap-best { color: #34c759; text-shadow: 0 0 10px rgba(52, 199, 89, 0.3); }
        .lap-worst { color: #ff3b30; text-shadow: 0 0 10px rgba(255, 59, 48, 0.3); }

        /* --- PROFILE & SETTINGS --- */
        .profile-card {
            background: linear-gradient(145deg, var(--surface-color), rgba(0,0,0,0.5));
            border: 1px solid var(--primary-glow);
            border-radius: 24px;
            padding: 25px;
            margin: 20px 0; /* Boşluklar dengelendi, taşma önlendi */
            text-align: center;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        
        .rank-title { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 5px; font-weight: 700; text-shadow: 0 0 15px var(--primary-glow); }
        .level-text { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        .xp-bar-container { height: 8px; background: var(--ring-bg); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .xp-fill { height: 100%; background: var(--primary); width: 0%; box-shadow: 0 0 10px var(--primary); transition: width 1s cubic-bezier(0.25, 1, 0.5, 1); }
        .xp-details { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

        /* Ayarlar Grid Yapısı */
        .settings-grid { padding-bottom: 30px; display: grid; gap: 25px; width: 100%; overflow-x: hidden; }
        .setting-block { width: 100%; }
        .setting-block h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: 600; }
        
        .scroll-row { 
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; 
            width: 100%; -webkit-overflow-scrolling: touch; 
        }
        .scroll-row::-webkit-scrollbar { display: none; }
        
        .opt-pill {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            color: var(--text-main); padding: 12px 20px; border-radius: 100px;
            white-space: nowrap; font-size: 0.9rem; font-weight: 500;
            transition: all 0.2s; cursor: pointer;
        }
        .opt-pill.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        
        /* Renk Seçici Düzenlemeleri (Köşelerden Taşma Koruması) */
        .color-dot {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent;
            flex-shrink: 0; transition: transform 0.2s; cursor: pointer;
        }
        .color-dot.active { transform: scale(1.15); border-color: var(--text-main); box-shadow: 0 0 15px currentColor; }
        
        .custom-color { 
            -webkit-appearance: none; appearance: none;
            width: 40px; height: 40px; border: none; padding: 0; background: transparent;
            border-radius: 50%; cursor: pointer;
            clip-path: circle(50% at 50% 50%); /* Dışarı taşmayı %100 oranında bıçak gibi keser */
        }
        .custom-color::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
        .custom-color::-webkit-color-swatch { border: none; border-radius: 50%; }
        .custom-color::-moz-color-swatch { border: none; border-radius: 50%; } /* Firefox için */

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: calc(70px + var(--safe-area-bottom));
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--surface-border);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: var(--safe-area-bottom);
            z-index: 100;
        }

        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: var(--text-muted); cursor: pointer; transition: color 0.3s;
        }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s; }
        .nav-item span { font-size: 0.75rem; font-weight: 600; }
        
        .nav-item.active { color: var(--primary); }
        .nav-item.active svg { transform: translateY(-3px); filter: drop-shadow(0 2px 5px var(--primary-glow)); }

        body.anim-smooth .timer-progress { transition: stroke-dashoffset 0.1s linear; }
        body.anim-tick .timer-progress { transition: stroke-dashoffset 0.2s steps(1); }
        body.anim-none .timer-progress, body.anim-none .focus-core { transition: none; animation: none; opacity: 0; }
    </style>
</head>
<body class="anim-smooth dark-theme">

    <div class="app-container">
        
        <!-- ================= STOPWATCH PAGE ================= -->
        <div id="page-stopwatch" class="page active">
            <div class="header">
                <h1>Kronometre</h1>
            </div>
            <div class="timer-showcase">
                <div class="timer-circle">
                    <svg class="timer-svg" viewBox="0 0 300 300">
                        <circle class="timer-bg" cx="150" cy="150" r="140"></circle>
                        <circle class="timer-progress" id="swRing" cx="150" cy="150" r="140"></circle>
                    </svg>
                    <div class="time-text" id="swTime">00:00</div>
                    <div class="ms-text" id="swMs">.00</div>
                </div>
            </div>
            <div class="controls-wrapper">
                <button class="btn-glass" onclick="veta.reset('sw')">Sıfırla</button>
                <button class="btn-glass btn-start" id="swBtnStart" onclick="veta.toggle('sw')">Başla</button>
                <button class="btn-glass" id="swBtnLap" onclick="veta.lap()">Tur</button>
            </div>
            <div class="list-container" id="lapsContainer">
                <!-- Laps go here -->
            </div>
        </div>

        <!-- ================= POMODORO PAGE ================= -->
        <div id="page-pomodoro" class="page">
            <div class="header">
                <h1>Odak Seansı</h1>
            </div>
            <div class="timer-showcase">
                <div class="timer-circle">
                    <div class="focus-core" id="focusCore"></div>
                    <svg class="timer-svg" viewBox="0 0 300 300">
                        <circle class="timer-bg" cx="150" cy="150" r="140"></circle>
                        <circle class="timer-progress" id="pmRing" cx="150" cy="150" r="140"></circle>
                    </svg>
                    <div class="time-text" id="pmTime" style="font-size: 5.5rem;">25:00</div>
                </div>
            </div>
            <div class="controls-wrapper">
                <button class="btn-glass" onclick="veta.reset('pm')">İptal</button>
                <button class="btn-glass btn-start" id="pmBtnStart" onclick="veta.toggle('pm')" style="width: 140px; border-radius: 100px;">Odaklan</button>
            </div>
            
            <div style="padding: 0 25px; margin-top: 20px; width: 100%;">
                <h3 style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase;">Seans Süresi</h3>
                <div class="scroll-row">
                    <button class="opt-pill active" onclick="veta.setPomodoroTime(25, this)">25 Dk (Klasik)</button>
                    <button class="opt-pill" onclick="veta.setPomodoroTime(45, this)">45 Dk (Derin Odak)</button>
                    <button class="opt-pill" onclick="veta.setPomodoroTime(60, this)">60 Dk (Usta)</button>
                </div>
            </div>
        </div>

        <!-- ================= PROFILE & SETTINGS PAGE ================= -->
        <div id="page-profile" class="page">
            <div class="header">
                <h1>Profil ve Arayüz</h1>
            </div>
            <div class="list-container">
                <div class="profile-card">
                    <div class="rank-title" id="rankDisplay">Kahraman (Heroic)</div>
                    <div class="level-text">Seviye <span id="levelDisplay">1</span></div>
                    
                    <div class="xp-bar-container">
                        <div class="xp-fill" id="xpFill"></div>
                    </div>
                    <div class="xp-details">
                        <span>Tecrübe</span>
                        <span id="xpText">0 / 100 XP</span>
                    </div>
                </div>

                <div class="settings-grid">
                    
                    <div class="setting-block">
                        <h3>Aura (Enerji Rengi)</h3>
                        <div class="scroll-row">
                            <input type="color" class="custom-color" id="customColor" value="#00e5ff" onchange="veta.applyColor(this.value)">
                            <div class="color-dot active" style="background: #00e5ff; color: #00e5ff;" onclick="veta.applyColor('#00e5ff', this)"></div>
                            <div class="color-dot" style="background: #ff2a5f; color: #ff2a5f;" onclick="veta.applyColor('#ff2a5f', this)"></div>
                            <div class="color-dot" style="background: #39ff14; color: #39ff14;" onclick="veta.applyColor('#39ff14', this)"></div>
                            <div class="color-dot" style="background: #bf00ff; color: #bf00ff;" onclick="veta.applyColor('#bf00ff', this)"></div>
                            <div class="color-dot" style="background: #ffae00; color: #ffae00;" onclick="veta.applyColor('#ffae00', this)"></div>
                        </div>
                    </div>

                    <div class="setting-block">
                        <h3>Dijital Tipografi (Yazı Tipi)</h3>
                        <div class="scroll-row">
                            <button class="opt-pill font-opt active" onclick="veta.applyFont('Space Grotesk', this)">Modern Sans</button>
                            <button class="opt-pill font-opt" onclick="veta.applyFont('Share Tech Mono', this)">Mekanik Dijital</button>
                            <button class="opt-pill font-opt" onclick="veta.applyFont('Orbitron', this)">Cyberpunk</button>
                            <button class="opt-pill font-opt" onclick="veta.applyFont('Rajdhani', this)">Teknoloji</button>
                            <button class="opt-pill font-opt" onclick="veta.applyFont('Caveat', this)">El Yazısı</button>
                        </div>
                    </div>

                    <div class="setting-block">
                        <h3>Görsel Motor (Animasyon)</h3>
                        <div class="scroll-row">
                            <button class="opt-pill anim-opt active" onclick="veta.applyAnim('anim-smooth', this)">Akıcı (60FPS)</button>
                            <button class="opt-pill anim-opt" onclick="veta.applyAnim('anim-tick', this)">Kuvars (Tik-Tak)</button>
                            <button class="opt-pill anim-opt" onclick="veta.applyAnim('anim-none', this)">Performans Modu (Efektsiz)</button>
                        </div>
                    </div>

                    <div class="setting-block">
                        <h3>Temel Tema</h3>
                        <div class="scroll-row">
                            <button class="opt-pill theme-opt active" onclick="veta.applyTheme('dark', this)">Derin Uzay (OLED)</button>
                            <button class="opt-pill theme-opt" onclick="veta.applyTheme('light', this)">Buz Beyazı</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- ================= BOTTOM NAVIGATION ================= -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="veta.nav('stopwatch', this)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>Kronometre</span>
        </div>
        <div class="nav-item" onclick="veta.nav('pomodoro', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            <span>Odak</span>
        </div>
        <div class="nav-item" onclick="veta.nav('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </div>
    </nav>

    <script>
        /* --- VETA ENGINE v5.1 CORE ARCHITECTURE --- */
        const veta = {
            state: {
                sw: { running: false, start: 0, elapsed: 0, id: null, laps: [] },
                pm: { running: false, start: 0, total: 25*60*1000, left: 25*60*1000, id: null },
                user: { level: 1, xp: 0 },
                circumference: 2 * Math.PI * 140
            },
            ranks: ["Acemi", "Usta", "Epik", "Efsanevi", "Kahraman (Heroic)", "Yüce (High)", "Mistik"],
            
            init() {
                this.loadProfile();
                this.updateProfileUI();
                
                document.getElementById('swRing').style.strokeDasharray = this.state.circumference;
                document.getElementById('pmRing').style.strokeDasharray = this.state.circumference;
                this.renderTime('sw', 0);
                this.renderTime('pm', this.state.pm.total);
            },

            /* -- NAVIGATION -- */
            nav(pageId, element) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(`page-${pageId}`).classList.add('active');
                
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                element.classList.add('active');
                this.vibrate(15);
            },

            /* -- CORE ENGINE -- */
            toggle(mode) {
                this.vibrate(30);
                const s = this.state[mode];
                const btn = document.getElementById(`${mode}BtnStart`); // 'swBtnStart' veya 'pmBtnStart'
                
                if (s.running) {
                    // Durdur
                    s.running = false;
                    cancelAnimationFrame(s.id);
                    if (mode === 'pm') s.left -= (performance.now() - s.start);
                    btn.textContent = mode === 'sw' ? 'Devam' : 'Devam Et';
                    btn.className = "btn-glass btn-start";
                    
                    if (mode === 'pm') document.getElementById('focusCore').style.opacity = '0';
                } else {
                    // Başlat
                    s.running = true;
                    s.start = performance.now();
                    if (mode === 'sw') s.start -= s.elapsed;
                    
                    btn.textContent = 'Durdur';
                    btn.className = "btn-glass btn-stop";
                    
                    if (mode === 'pm') document.getElementById('focusCore').style.opacity = '0.5';
                    s.id = requestAnimationFrame((ts) => this.loop(ts, mode));
                }
            },

            loop(timestamp, mode) {
                const s = this.state[mode];
                if (!s.running) return;

                let displayMs = 0;
                let progress = 0;

                if (mode === 'sw') {
                    s.elapsed = performance.now() - s.start;
                    displayMs = s.elapsed;
                    progress = (displayMs % 60000) / 60000;
                } else {
                    const passed = performance.now() - s.start;
                    let currentLeft = s.left - passed;
                    
                    const core = document.getElementById('focusCore');
                    let intensity = 0.3 + ((s.total - currentLeft) / s.total) * 0.7;
                    if(core && currentLeft > 0) core.style.transform = `scale(${0.8 + intensity * 0.4})`;

                    if (currentLeft <= 0) {
                        currentLeft = 0;
                        this.toggle('pm');
                        this.pomodoroFinish();
                    }
                    displayMs = currentLeft;
                    progress = 1 - (displayMs / s.total);
                }

                this.renderTime(mode, displayMs);
                document.getElementById(`${mode}Ring`).style.strokeDashoffset = this.state.circumference - (progress * this.state.circumference);
                
                s.id = requestAnimationFrame((ts) => this.loop(ts, mode));
            },

            reset(mode) {
                this.vibrate(50);
                const s = this.state[mode];
                s.running = false;
                cancelAnimationFrame(s.id);
                
                const btn = document.getElementById(`${mode}BtnStart`);
                btn.textContent = mode === 'sw' ? 'Başla' : 'Odaklan';
                btn.className = "btn-glass btn-start";
                
                if (mode === 'sw') {
                    s.elapsed = 0;
                    this.renderTime('sw', 0);
                    s.laps = [];
                    document.getElementById('lapsContainer').innerHTML = '';
                } else {
                    s.left = s.total;
                    this.renderTime('pm', s.total);
                    document.getElementById('focusCore').style.opacity = '0';
                    document.getElementById('focusCore').style.transform = 'scale(0.8)';
                }
                document.getElementById(`${mode}Ring`).style.strokeDashoffset = this.state.circumference;
            },

            renderTime(mode, ms) {
                const d = new Date(ms);
                const min = String(d.getUTCMinutes()).padStart(2, '0');
                const sec = String(d.getUTCSeconds()).padStart(2, '0');
                const milli = String(Math.floor(d.getUTCMilliseconds() / 10)).padStart(2, '0');
                
                if (mode === 'sw') {
                    document.getElementById('swTime').textContent = `${min}:${sec}`;
                    document.getElementById('swMs').textContent = `.${milli}`;
                } else {
                    document.getElementById('pmTime').textContent = `${min}:${sec}`;
                }
            },

            /* -- LAP SYSTEM -- */
            lap() {
                if (!this.state.sw.running && this.state.sw.elapsed === 0) return;
                this.vibrate([20, 30]);
                
                const current = this.state.sw.elapsed;
                const prevTotal = this.state.sw.laps.reduce((a, b) => a + b, 0);
                this.state.sw.laps.push(current - prevTotal);
                
                this.renderLaps();
            },

            renderLaps() {
                const container = document.getElementById('lapsContainer');
                container.innerHTML = '';
                const arr = this.state.sw.laps;
                if(arr.length === 0) return;

                const minLap = Math.min(...arr);
                const maxLap = Math.max(...arr);

                for (let i = arr.length - 1; i >= 0; i--) {
                    const div = document.createElement('div');
                    div.className = 'lap-item';
                    
                    let titleText = `Tur ${i + 1}`;
                    let isBest = (arr[i] === minLap && arr.length > 1);
                    let isWorst = (arr[i] === maxLap && arr.length > 1);

                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'lap-title';
                    titleSpan.textContent = titleText;
                    
                    const timeSpan = document.createElement('span');
                    const d = new Date(arr[i]);
                    timeSpan.textContent = `${String(d.getUTCMinutes()).padStart(2, '0')}:${String(d.getUTCSeconds()).padStart(2, '0')}.${String(Math.floor(d.getUTCMilliseconds() / 10)).padStart(2, '0')}`;
                    
                    if (isBest) { timeSpan.classList.add('lap-best'); titleSpan.textContent += " (Hızlı)"; }
                    if (isWorst) { timeSpan.classList.add('lap-worst'); titleSpan.textContent += " (Yavaş)"; }

                    div.appendChild(titleSpan);
                    div.appendChild(timeSpan);
                    container.appendChild(div);
                }
            },

            /* -- POMODORO SETTINGS -- */
            setPomodoroTime(minutes, el) {
                if(this.state.pm.running) this.reset('pm');
                this.vibrate(15);
                
                document.querySelectorAll('#page-pomodoro .opt-pill').forEach(btn => btn.classList.remove('active'));
                el.classList.add('active');
                
                this.state.pm.total = minutes * 60 * 1000;
                this.reset('pm');
            },

            pomodoroFinish() {
                this.vibrate([100, 50, 100, 50, 100]);
                const earnedXP = (this.state.pm.total / 60000) * 2;
                this.addXP(earnedXP);
                
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: [getComputedStyle(document.body).getPropertyValue('--primary').trim(), '#fff'] });
            },

            /* -- GAMIFICATION (PROFILE) -- */
            loadProfile() {
                this.state.user.level = parseInt(localStorage.getItem('veta_lvl')) || 1;
                this.state.user.xp = parseInt(localStorage.getItem('veta_xp')) || 0;
                
                const savedColor = localStorage.getItem('veta_color');
                if(savedColor) this.applyColor(savedColor, null);
                
                const savedFont = localStorage.getItem('veta_font');
                if(savedFont) this.applyFont(savedFont, null);
            },

            updateProfileUI() {
                const nextXP = this.state.user.level * 100;
                document.getElementById('levelDisplay').textContent = this.state.user.level;
                document.getElementById('xpText').textContent = `${Math.floor(this.state.user.xp)} / ${nextXP} XP`;
                document.getElementById('xpFill').style.width = `${(this.state.user.xp / nextXP) * 100}%`;
                
                let rankIndex = Math.floor((this.state.user.level - 1) / 3);
                if(rankIndex >= this.ranks.length) rankIndex = this.ranks.length - 1;
                document.getElementById('rankDisplay').textContent = this.ranks[rankIndex];
                
                localStorage.setItem('veta_lvl', this.state.user.level);
                localStorage.setItem('veta_xp', this.state.user.xp);
            },

            addXP(amount) {
                this.state.user.xp += amount;
                let nextXP = this.state.user.level * 100;
                let leveled = false;
                
                while(this.state.user.xp >= nextXP) {
                    this.state.user.xp -= nextXP;
                    this.state.user.level++;
                    nextXP = this.state.user.level * 100;
                    leveled = true;
                }
                this.updateProfileUI();
                
                if(leveled) {
                    setTimeout(() => {
                        alert(`Seviye Atladın! Yeni Seviye: ${this.state.user.level}`);
                        confetti({ particleCount: 200, spread: 100, colors: ['#ffd700'] });
                    }, 500);
                }
            },

            /* -- APPEARANCE SETTINGS -- */
            applyColor(hex, el = null) {
                document.documentElement.style.setProperty('--primary', hex);
                const rgb = this.hexToRgb(hex);
                document.documentElement.style.setProperty('--primary-glow', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.4)`);
                
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                if(el) el.classList.add('active');
                
                document.getElementById('customColor').value = hex;
                localStorage.setItem('veta_color', hex);
            },

            applyFont(fontName, el) {
                document.documentElement.style.setProperty('--timer-font', `'${fontName}', sans-serif`);
                if(el) {
                    document.querySelectorAll('.font-opt').forEach(btn => btn.classList.remove('active'));
                    el.classList.add('active');
                }
                localStorage.setItem('veta_font', fontName);
            },

            applyAnim(animClass, el) {
                document.body.classList.remove('anim-smooth', 'anim-tick', 'anim-none');
                document.body.classList.add(animClass);
                document.querySelectorAll('.anim-opt').forEach(btn => btn.classList.remove('active'));
                el.classList.add('active');
            },

            applyTheme(theme, el) {
                if(theme === 'light') document.body.classList.add('light-theme');
                else document.body.classList.remove('light-theme');
                
                document.querySelectorAll('.theme-opt').forEach(btn => btn.classList.remove('active'));
                el.classList.add('active');
            },

            /* -- UTILS -- */
            vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); },
            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 229, b: 255 };
            }
        };

        window.onload = () => veta.init();
    </script>
</body>
</html>
