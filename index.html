<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veta Kronometre Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <!-- Genişletilmiş Font Kütüphanesi -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&family=Press+Start+2P&family=Rajdhani:wght@500;700&family=Caveat:wght@600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* [Veta Engine CSS] - Gelişmiş Stil Motoru */
        :root {
            --bg-color: #0d0d12;
            --surface-color: #1a1a24;
            --text-color: #ffffff;
            --text-muted: #888899;
            --primary-color: #00e5ff; /* Varsayılan: Turkuaz */
            --ring-bg: #2a2a35;
            
            --font-family: 'Share Tech Mono', monospace; /* Varsayılan Font */
        }

        /* Light Theme Değişkenleri */
        body.light-mode {
            --bg-color: #f0f2f5;
            --surface-color: #ffffff;
            --text-color: #1a1a1a;
            --text-muted: #666666;
            --ring-bg: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Üst Menü / Mod Seçimi */
        .top-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
        }

        .mode-btn {
            background: transparent;
            border: 2px solid var(--text-muted);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        /* Ana Gösterge Alanı */
        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Görünüm Modları (Layouts) */
        /* 1. Klasik Mod */
        .timer-circle {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .timer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: var(--ring-bg);
            stroke-width: 8;
            transition: stroke 0.4s ease;
        }

        .timer-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 816; /* 2 * PI * r (r=130) */
            stroke-dashoffset: 816;
            transition: stroke 0.4s ease;
        }

        /* Minimal Görünüm: Halkayı gizle */
        body.layout-minimal .timer-bg, 
        body.layout-minimal .timer-progress {
            display: none;
        }

        /* Dashboard Görünümü */
        body.layout-dashboard .timer-circle {
            width: 320px;
            height: 150px;
        }
        body.layout-dashboard .timer-bg, 
        body.layout-dashboard .timer-progress {
            display: none; /* Daire yerine yatay tasarım yapılabilir, şimdilik gizli */
        }
        body.layout-dashboard .time-display {
            font-size: 4rem;
            background: var(--surface-color);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-left: 5px solid var(--primary-color);
        }

        /* Zaman Metni */
        .time-display {
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: 2px;
            z-index: 10;
            text-shadow: 0 0 20px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
        }
        
        .ms-display {
            font-size: 1.2rem;
            color: var(--text-muted);
            position: absolute;
            bottom: 60px;
            z-index: 10;
        }

        /* Kontrol Butonları */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s, filter 0.3s;
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .btn-start { background-color: rgba(46, 213, 115, 0.8); }
        .btn-stop { background-color: rgba(255, 71, 87, 0.8); }
        .btn-lap { background-color: rgba(116, 125, 140, 0.8); }
        .btn-reset { background-color: rgba(255, 165, 2, 0.8); }

        /* Ayarlar ve Tur (Lap) Paneli Bölümü */
        .bottom-panels {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--surface-color);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            transition: background 0.4s ease;
        }

        .panel-tabs {
            display: flex;
            background: rgba(0,0,0,0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        .panel-content.active {
            display: block;
        }

        /* Laps Listesi */
        .lap-list {
            list-style: none;
        }
        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--ring-bg);
            font-family: var(--font-family);
            font-size: 1.1rem;
        }

        /* Ayarlar Menüsü */
        .setting-group {
            margin-bottom: 25px;
        }
        .setting-title {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .options-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        
        .options-row::-webkit-scrollbar { display: none; }

        .opt-btn {
            background: var(--bg-color);
            border: 1px solid var(--ring-bg);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            white-space: nowrap;
            font-family: 'Roboto', sans-serif;
            transition: all 0.2s;
        }

        .opt-btn.active {
            border-color: var(--primary-color);
            background: rgba(0,0,0,0.1);
        }

        /* Renk Seçiciler */
        .color-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
        }
        .color-circle.active {
            border-color: var(--text-color);
            transform: scale(1.1);
        }

        /* Animasyon Efektleri */
        /* Nabız (Pulse) Animasyonu */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        body.anim-pulse .timer-circle {
            animation: pulse 1s infinite ease-in-out;
        }

        /* Animasyon Kapalıysa Progress geçişini kapat */
        body.anim-none .timer-progress {
            transition: none;
        }
        
        body.anim-smooth .timer-progress {
            transition: stroke-dashoffset 0.1s linear;
        }
        
        body.anim-tick .timer-progress {
            transition: stroke-dashoffset 0.2s steps(1); /* Saniye saniye atlar */
        }


    </style>
</head>
<body class="anim-smooth layout-classic">

    <!-- Üst Menü -->
    <div class="top-bar">
        <button class="mode-btn active" onclick="setMode('stopwatch')">Kronometre</button>
        <button class="mode-btn" onclick="setMode('pomodoro')">Pomodoro</button>
    </div>

    <!-- Ana Gösterge -->
    <div class="display-container">
        <div class="timer-circle" id="timerCircle">
            <svg class="timer-svg" viewBox="0 0 280 280">
                <circle class="timer-bg" cx="140" cy="140" r="130"></circle>
                <circle class="timer-progress" id="progressRing" cx="140" cy="140" r="130"></circle>
            </svg>
            <div class="time-display" id="timeDisplay">00:00.00</div>
            <div class="ms-display" id="msDisplay" style="display:none;"></div> <!-- MS ayrılabilir istenirse -->
        </div>
    </div>

    <!-- Kontroller -->
    <div class="controls">
        <button class="ctrl-btn btn-reset" onclick="resetTimer()">Sıfırla</button>
        <button class="ctrl-btn btn-start" id="startBtn" onclick="toggleTimer()">Başla</button>
        <button class="ctrl-btn btn-lap" id="lapBtn" onclick="recordLap()">Tur</button>
    </div>

    <!-- Alt Paneller (Tur ve Ayarlar) -->
    <div class="bottom-panels">
        <div class="panel-tabs">
            <button class="tab-btn active" onclick="switchTab('lapsTab')">Turlar</button>
            <button class="tab-btn" onclick="switchTab('settingsTab')">Görünüm Ayarları</button>
        </div>
        
        <!-- Tur Listesi -->
        <div id="lapsTab" class="panel-content active">
            <ul class="lap-list" id="lapList">
                <li style="text-align:center; color:var(--text-muted); font-family: 'Roboto', sans-serif;">Henüz tur kaydedilmedi.</li>
            </ul>
        </div>

        <!-- Ayarlar -->
        <div id="settingsTab" class="panel-content">
            
            <!-- Renk Temaları -->
            <div class="setting-group">
                <div class="setting-title">Tema Rengi</div>
                <div class="options-row">
                    <div class="color-circle active" style="background-color: #00e5ff;" onclick="applyColor(this, '#00e5ff')"></div>
                    <div class="color-circle" style="background-color: #ff3366;" onclick="applyColor(this, '#ff3366')"></div>
                    <div class="color-circle" style="background-color: #00ff66;" onclick="applyColor(this, '#00ff66')"></div>
                    <div class="color-circle" style="background-color: #ffd700;" onclick="applyColor(this, '#ffd700')"></div>
                    <div class="color-circle" style="background-color: #bc13fe;" onclick="applyColor(this, '#bc13fe')"></div>
                    <div class="color-circle" style="background-color: #ff8c00;" onclick="applyColor(this, '#ff8c00')"></div>
                </div>
            </div>

            <!-- Arka Plan Teması -->
            <div class="setting-group">
                <div class="setting-title">Arka Plan Modu</div>
                <div class="options-row">
                    <button class="opt-btn bg-opt active" onclick="applyTheme(this, 'dark')">Koyu Tema</button>
                    <button class="opt-btn bg-opt" onclick="applyTheme(this, 'light')">Açık Tema</button>
                </div>
            </div>

            <!-- Font Seçimi -->
            <div class="setting-group">
                <div class="setting-title">Yazı Tipi (Font)</div>
                <div class="options-row">
                    <button class="opt-btn font-opt active" onclick="applyFont(this, 'Share Tech Mono')">Dijital</button>
                    <button class="opt-btn font-opt" onclick="applyFont(this, 'Orbitron')">Cyberpunk</button>
                    <button class="opt-btn font-opt" onclick="applyFont(this, 'Press Start 2P')">Arcade</button>
                    <button class="opt-btn font-opt" onclick="applyFont(this, 'Rajdhani')">Modern</button>
                    <button class="opt-btn font-opt" onclick="applyFont(this, 'Caveat')">El Yazısı</button>
                </div>
            </div>

            <!-- Görünüm (Layout) -->
            <div class="setting-group">
                <div class="setting-title">Sayaç Görünümü</div>
                <div class="options-row">
                    <button class="opt-btn layout-opt active" onclick="applyLayout(this, 'layout-classic')">Klasik Halka</button>
                    <button class="opt-btn layout-opt" onclick="applyLayout(this, 'layout-minimal')">Minimal (Halkasız)</button>
                    <button class="opt-btn layout-opt" onclick="applyLayout(this, 'layout-dashboard')">Dashboard</button>
                </div>
            </div>

            <!-- Animasyon Stili -->
            <div class="setting-group">
                <div class="setting-title">Animasyon Stili</div>
                <div class="options-row">
                    <button class="opt-btn anim-opt active" onclick="applyAnim(this, 'anim-smooth')">Akıcı (Pürüzsüz)</button>
                    <button class="opt-btn anim-opt" onclick="applyAnim(this, 'anim-tick')">Tik-Tak (Saniyeli)</button>
                    <button class="opt-btn anim-opt" onclick="applyAnim(this, 'anim-pulse')">Nabız (Atımlı)</button>
                    <button class="opt-btn anim-opt" onclick="applyAnim(this, 'anim-none')">Kapalı</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        /* --- VETA ENGINE v2.0 - Core Logic --- */
        let mode = 'stopwatch'; // 'stopwatch' veya 'pomodoro'
        let isRunning = false;
        let startTime = 0;
        let elapsedTime = 0;
        let animationFrameId;
        
        // Pomodoro Ayarları (milisaniye cinsinden)
        const POMODORO_WORK_TIME = 25 * 60 * 1000;
        let pomodoroTimeLeft = POMODORO_WORK_TIME;

        // UI Elementleri
        const timeDisplay = document.getElementById('timeDisplay');
        const progressRing = document.getElementById('progressRing');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const lapList = document.getElementById('lapList');
        
        let lapCount = 1;

        // Çember Çevresi Hesaplama
        const radius = progressRing.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = circumference;

        /* --- Çekirdek Döngü (Game Loop benzeri) --- */
        function updateEngine(timestamp) {
            if (!isRunning) return;

            let displayTime = 0;
            let progress = 0;

            if (mode === 'stopwatch') {
                elapsedTime = performance.now() - startTime;
                displayTime = elapsedTime;
                // Kronometre için halka 60 saniyede bir tam tur döner
                progress = (displayTime % 60000) / 60000; 
            } else {
                // Pomodoro
                const passedTime = performance.now() - startTime;
                let currentLeft = pomodoroTimeLeft - passedTime;
                
                if (currentLeft <= 0) {
                    currentLeft = 0;
                    toggleTimer(); // Süre bitince durdur
                    alert("Pomodoro Tamamlandı!");
                }
                displayTime = currentLeft;
                progress = 1 - (displayTime / POMODORO_WORK_TIME);
            }

            renderTime(displayTime);
            
            // Halka Animasyonu (anim-tick modu için özel kontrol gerekmez, CSS hallediyor)
            const offset = circumference - (progress * circumference);
            progressRing.style.strokeDashoffset = offset;

            animationFrameId = requestAnimationFrame(updateEngine);
        }

        /* --- Zaman Formatlama ve Render --- */
        function renderTime(timeInMs) {
            const date = new Date(timeInMs);
            const minutes = String(date.getUTCMinutes()).padStart(2, '0');
            const seconds = String(date.getUTCSeconds()).padStart(2, '0');
            const milliseconds = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
            
            timeDisplay.textContent = `${minutes}:${seconds}.${milliseconds}`;
        }

        /* --- Kontroller --- */
        function toggleTimer() {
            if (isRunning) {
                // Durdur
                isRunning = false;
                cancelAnimationFrame(animationFrameId);
                if (mode === 'stopwatch') {
                    // elapsedTime zaten son değeri tutuyor
                } else {
                    pomodoroTimeLeft = pomodoroTimeLeft - (performance.now() - startTime);
                }
                startBtn.textContent = 'Başla';
                startBtn.style.backgroundColor = 'rgba(46, 213, 115, 0.8)';
                lapBtn.textContent = 'Tur';
            } else {
                // Başlat
                isRunning = true;
                startTime = performance.now();
                if (mode === 'stopwatch') {
                    startTime -= elapsedTime; // Kaldığı yerden devam etmesi için
                }
                startBtn.textContent = 'Durdur';
                startBtn.style.backgroundColor = 'rgba(255, 71, 87, 0.8)';
                animationFrameId = requestAnimationFrame(updateEngine);
            }
        }

        function resetTimer() {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            startBtn.textContent = 'Başla';
            startBtn.style.backgroundColor = 'rgba(46, 213, 115, 0.8)';
            
            if (mode === 'stopwatch') {
                elapsedTime = 0;
                renderTime(0);
                progressRing.style.strokeDashoffset = circumference;
            } else {
                pomodoroTimeLeft = POMODORO_WORK_TIME;
                renderTime(pomodoroTimeLeft);
                progressRing.style.strokeDashoffset = circumference;
            }

            // Turları Temizle
            lapList.innerHTML = `<li style="text-align:center; color:var(--text-muted); font-family: 'Roboto', sans-serif;">Henüz tur kaydedilmedi.</li>`;
            lapCount = 1;
        }

        function recordLap() {
            if (mode !== 'stopwatch') return; // Pomodoroda tur olmaz
            
            if (!isRunning && elapsedTime === 0) return;

            // İlk tur kaydedildiğinde boş mesajı sil
            if (lapCount === 1) lapList.innerHTML = '';

            const li = document.createElement('li');
            li.className = 'lap-item';
            
            const lapTitle = document.createElement('span');
            lapTitle.textContent = `Tur ${lapCount}`;
            
            const lapTimeSpan = document.createElement('span');
            lapTimeSpan.textContent = timeDisplay.textContent;

            li.appendChild(lapTitle);
            li.appendChild(lapTimeSpan);
            
            lapList.prepend(li); // En yeni tur en üste eklensin
            lapCount++;
        }

        function setMode(newMode) {
            if(isRunning) toggleTimer(); // Mod değişirken durdur
            
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'stopwatch') {
                lapBtn.style.display = 'block';
            } else {
                lapBtn.style.display = 'none'; // Pomodoroda tur butonu gizle
            }
            resetTimer();
        }

        /* --- Arayüz Kontrolleri (Sekmeler ve Ayarlar) --- */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.querySelectorAll('.panel-content').forEach(panel => panel.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        // Ayar Uygulayıcılar
        function applyColor(element, colorHex) {
            document.querySelectorAll('.color-circle').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.documentElement.style.setProperty('--primary-color', colorHex);
        }

        function applyTheme(element, theme) {
            document.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            if(theme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        }

        function applyFont(element, fontName) {
            document.querySelectorAll('.font-opt').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            // Eğer Arcade fontu seçilirse font boyutunu biraz küçült (sığması için)
            if(fontName === 'Press Start 2P') {
                timeDisplay.style.fontSize = '2.2rem';
            } else {
                timeDisplay.style.fontSize = '3.5rem';
            }
            
            document.documentElement.style.setProperty('--font-family', `'${fontName}', sans-serif`);
        }

        function applyLayout(element, layoutClass) {
            document.querySelectorAll('.layout-opt').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            // Eski layout sınıflarını temizle
            document.body.classList.remove('layout-classic', 'layout-minimal', 'layout-dashboard');
            document.body.classList.add(layoutClass);
        }

        function applyAnim(element, animClass) {
            document.querySelectorAll('.anim-opt').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            document.body.classList.remove('anim-smooth', 'anim-tick', 'anim-pulse', 'anim-none');
            document.body.classList.add(animClass);
            
            // Eğer pulse seçiliyse ve çalışmıyorsa animasyonu geçici durdurmak gerekebilir ama CSS hallediyor.
        }

        // Başlangıç Ayarı
        renderTime(0);

    </script>
</body>
                    </html>
